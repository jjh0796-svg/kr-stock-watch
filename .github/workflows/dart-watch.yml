name: DART Watch

run-name: DART Watch (${{ inputs.trigger_source || github.event_name }})


on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "텔레그램 발송 없이 실행"
        required: false
        type: boolean
        default: false
      single_shot:
        description: "1회만 폴링하고 종료 (테스트용)"
        required: false
        type: boolean
        default: false
      trigger_source:
        description: "호출자 라벨 (cron-job.org 등)"
        required: false
        type: string
        default: "manual"
  schedule:
    # 백업용 — 주 트리거는 cron-job.org의 15분 간격 workflow_dispatch.
    # KST 07:20~19:50 창은 스크립트가 자체 판단하므로 넉넉히 걸어둔다.
    - cron: "5,25,45 22,23 * * 0-4"   # KST 07~08시대 (전일 UTC)
    - cron: "5,25,45 0-10 * * 1-5"    # KST 09~19시대
    # 감시 시간대 밖(저녁·주말)에는 텔레그램 명령 접수용으로만 가끔 깨어난다
    # (2026-08-29 봇 분리 후 30분 간격으로 단축 — GA cron 지연을 감안한 응답성 확보.
    #  시간대 밖 실행은 명령만 처리하고 수 초에 끝나 비용 없음)
    - cron: "0,30 11-14 * * 1-5"      # KST 평일 20~23시
    - cron: "0,30 * * * 6,0"          # 주말 30분 간격

concurrency:
  group: dart-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Restore seen state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: dart-state-${{ github.run_id }}
          restore-keys: |
            dart-state-

      - name: Run DART watch
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 2026-08-29 봇 분리: 공시 알림·명령은 전용 '공시모니터링' 봇으로
          # (미등록 시 기존 종목모니터링 봇 폴백)
          TELEGRAM_BOT_TOKEN: ${{ secrets.DART_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          FILER_KEYWORDS: ${{ vars.FILER_KEYWORDS }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          POLL_TOTAL_SECONDS: ${{ inputs.single_shot == true && '0' || '870' }}
          # 2026-08-29 감시 주기 단축 60→30초 (DART 호출 ~1.5천/일 — kr-earnings-pulse
          # 1.1만과 합쳐도 일 한도 2만의 65% 수준)
          POLL_INTERVAL: "30"
        run: python dart_watch.py

      - name: Save seen state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: dart-state-${{ github.run_id }}
