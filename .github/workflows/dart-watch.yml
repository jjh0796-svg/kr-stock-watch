name: DART Watch

run-name: DART Watch (${{ inputs.trigger_source || github.event_name }})

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "텔레그램 발송 없이 실행"
        required: false
        type: boolean
        default: false
      single_shot:
        description: "1회만 폴링하고 종료 (테스트용)"
        required: false
        type: boolean
        default: false
      trigger_source:
        description: "호출자 라벨 (cron-job.org 등)"
        required: false
        type: string
        default: "manual"
  schedule:
    # 백업용 — 주 트리거는 cron-job.org의 15분 간격 workflow_dispatch.
    # KST 07:20~19:50 창은 스크립트가 자체 판단하므로 넉넉히 걸어둔다.
    - cron: "5,25,45 22,23 * * 0-4"   # KST 07~08시대 (전일 UTC)
    - cron: "5,25,45 0-10 * * 1-5"    # KST 09~19시대

concurrency:
  group: dart-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Restore seen state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: dart-state-${{ github.run_id }}
          restore-keys: |
            dart-state-

      - name: Run DART watch
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          FILER_KEYWORDS: ${{ vars.FILER_KEYWORDS }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          POLL_TOTAL_SECONDS: ${{ inputs.single_shot == true && '0' || '870' }}
        run: python dart_watch.py

      - name: Save seen state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: dart-state-${{ github.run_id }}
