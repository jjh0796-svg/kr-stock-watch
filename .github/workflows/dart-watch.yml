name: DART Watch

run-name: DART Watch (${{ inputs.trigger_source || github.event_name }})

# watch_config_repo.json 부트스트랩 커밋용 (텔레그램 명령 허브 통합, 2026-08-29)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "텔레그램 발송 없이 실행"
        required: false
        type: boolean
        default: false
      single_shot:
        description: "1회만 폴링하고 종료 (테스트용)"
        required: false
        type: boolean
        default: false
      trigger_source:
        description: "호출자 라벨 (cron-job.org 등)"
        required: false
        type: string
        default: "manual"
  schedule:
    # 백업용 — 주 트리거는 cron-job.org의 15분 간격 workflow_dispatch.
    # KST 07:20~19:50 창은 스크립트가 자체 판단하므로 넉넉히 걸어둔다.
    - cron: "5,25,45 22,23 * * 0-4"   # KST 07~08시대 (전일 UTC)
    - cron: "5,25,45 0-10 * * 1-5"    # KST 09~19시대
    # 감시 시간대 밖(저녁·주말)에는 텔레그램 명령 접수용으로만 가끔 깨어난다
    - cron: "0 11-14 * * 1-5"         # KST 평일 20~23시 정각
    - cron: "0 */2 * * 6,0"           # 주말 2시간 간격

concurrency:
  group: dart-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Restore seen state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: dart-state-${{ github.run_id }}
          restore-keys: |
            dart-state-

      - name: Run DART watch
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          FILER_KEYWORDS: ${{ vars.FILER_KEYWORDS }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          POLL_TOTAL_SECONDS: ${{ inputs.single_shot == true && '0' || '870' }}
        run: python dart_watch.py

      - name: Save seen state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: dart-state-${{ github.run_id }}

      # 첫 실행이 캐시 설정을 watch_config_repo.json으로 스냅샷하면 커밋해
      # 서버 watch_bot(명령 허브)이 그 위에서 이어가게 한다. 이후 작성자는 서버뿐.
      - name: Commit config bootstrap
        if: always()
        run: |
          if [ -n "$(git status --porcelain watch_config_repo.json)" ]; then
            git config user.name "dart-watch"
            git config user.email "bot@actions"
            git add watch_config_repo.json
            git commit -m "watch_config 부트스트랩 스냅샷 (캐시 → repo)"
            git pull --rebase -q && git push -q
          fi
